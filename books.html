<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />

  </head>

  <body class="index">
    <header>
      <nav>
        <ul>
          <li><a href="index.html">eu</a></li>
          <li><a href="portfolio.html">portfolio</a></li>
          <li><a href="books.html" aria-current>livros</a></li>
          <li><a href="gallery.html">galeria</a></li>
          <li><a href="cool-stuff.html">coisas legais</a></li>
        </ul>
      </nav>
    </header>

    <main class="pages-container">
      <h1>livros</h1>
      <p class="intro">
        o que estou lendo, que já li ou tenho vontade de ler
      </p>
      <div class="gallery" data-gallery="assets/books"></div>
    </main>

    <footer class="small">
      <p id="bh">belo horizonte, mg</p>
      <p>última atualização: 06/11/2026</p>
    </footer>

    <script type="module" src="gallery.js"></script>
    <script>
      const el = document.getElementById("bh");

      const climas = {
        0: ["céu limpo", "☀️"],
        1: ["poucas nuvens", "🌤️"],
        2: ["parcialmente nublado", "⛅"],
        3: ["nublado", "☁️"],
        45: ["neblina", "🌫️"],
        48: ["neblina", "🌫️"],
        51: ["garoa", "🌦️"],
        53: ["garoa", "🌦️"],
        55: ["garoa", "🌦️"],
        61: ["chuva fraca", "🌧️"],
        63: ["chuva", "🌧️"],
        65: ["chuva forte", "🌧️"],
        80: ["pancadas de chuva", "🌦️"],
        81: ["pancadas de chuva", "🌧️"],
        82: ["temporal", "⛈️"],
        95: ["trovoada", "⛈️"],
        96: ["trovoada", "⛈️"],
        99: ["trovoada", "⛈️"],
      };

      let weather = "";

      function hour() {
        return new Date().toLocaleTimeString("pt-BR", {
          timeZone: "America/Sao_Paulo",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function show() {
        el.textContent = `${hour()} em belo horizonte${weather}`;
      }

      fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=-19.92&longitude=-43.94&current=temperature_2m,weather_code&timezone=America%2FSao_Paulo",
      )
        .then((r) => r.json())
        .then((d) => {
          const celsius = Math.round(d.current.temperature_2m);
          const [text, emoji] = climas[d.current.weather_code] ?? ["", ""];
          weather = ` · ${celsius}°C, ${text} ${emoji}`;
          show();
        })
        .catch(() => {}); // se a API falhar, mostra só a hora

      show();
      setInterval(show, 60000); // atualiza o relógio a cada minuto
    </script>
  </body>
</html>
